services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: approvia
      POSTGRES_USER: approvia
      POSTGRES_PASSWORD: approvia
    ports:
      - '${DATABASE_PORT:-5433}:5432'
    volumes:
      - approvia-database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U approvia']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  approvia-database:
